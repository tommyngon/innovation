<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worker</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);padding:var(--s3) var(--s4)}
.top .sp{flex:1}
.room{font-weight:700;font-size:18px}
.pill{min-height:48px;display:inline-flex;align-items:center;gap:var(--s2);font-weight:600;font-size:15px;padding:0 var(--s4)}
.pill.sm{font-weight:600}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);font-weight:600}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.conn.off i{background:transparent;border:2px solid var(--no)}
.conn.off{color:var(--no)}
.clearbox{display:inline-flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.btn{min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:0 var(--s5)}
.btn.pri{background:var(--blue);color:#fff}
.btn.ack{background:var(--warm-ink);color:#fff}
.btn.danger{background:var(--no);color:#fff}
.btn.mic{background:var(--blue);color:#fff;flex:none}
.btn.mic.on{background:var(--listen)}
.layout{flex:1;min-height:0;display:grid;gap:var(--s4);padding:0 var(--s4) var(--s3);grid-template-columns:1fr;grid-template-areas:"calls" "conv" "side"}
#calls{grid-area:calls}
.convcol{grid-area:conv;display:flex;flex-direction:column;gap:var(--s3);min-width:0}
#sum{grid-area:side}
@media (min-width:900px) and (orientation:landscape){
  body{height:100vh}
  .layout{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr;grid-template-areas:"conv calls" "conv side";overflow:hidden}
  .conv{flex:1;min-height:0}
  #sum{overflow:auto;align-self:start;max-height:100%}
}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);background:var(--warm);color:var(--warm-ink);border-radius:var(--r-card);padding:var(--s4);font-weight:700;box-shadow:var(--shadow-1);margin-bottom:var(--s3)}
.banner span{flex:1;min-width:140px}
.conv{display:flex;flex-direction:column;gap:var(--s4);overflow-y:auto;padding:var(--s2) var(--s2) var(--s4);min-height:200px;max-height:58vh}
@media (min-width:900px) and (orientation:landscape){.conv{max-height:none}}
.empty{color:var(--muted);text-align:center;margin:auto;padding:var(--s6)}
.bubble{overflow-wrap:anywhere;font-size:17px;max-width:min(86%,680px)}
.bubble.old{animation:none}
.bubble .who{font-size:15px;display:flex;gap:var(--s2);align-items:baseline}
.bubble .who time{font-weight:500;color:var(--muted)}
.bubble .big{font-size:21px;font-weight:500;line-height:1.3;margin:0}
.bubble .orig{font-size:15px;color:var(--muted);margin:var(--s2) 0 0}
.meta{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s2);font-size:14px;color:var(--muted);font-weight:600}
.meta .ic{width:1.1em;height:1.1em}
.meta .seen{color:var(--ok)}
.meta .wq{display:inline-flex;color:var(--unsure-ink)}
.composer{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-2);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.qrow{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s2);scrollbar-width:thin}
.qp{flex:none;min-height:48px;background:var(--blue-soft);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;padding:0 var(--s4);box-shadow:none}
.inrow{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end}
.inrow textarea{flex:1 1 180px;min-width:0;min-height:48px;font-size:17px;resize:vertical;border-radius:var(--r-input)}
.inrow textarea:focus{border-color:var(--blue)}
.inrow textarea.live{color:#7a8794;font-style:italic}
.level{height:8px;background:var(--line);border-radius:var(--r-pill);overflow:hidden}
.level i{display:block;height:100%;width:0;background:var(--listen)}
.lab{font-size:15px;font-weight:600;color:var(--muted);margin:0}
.preview{display:flex;flex-direction:column;gap:var(--s3)}
.preview .big{font-size:24px;font-weight:600;line-height:1.3;margin:0;background:var(--teal-soft);border-radius:var(--r-bubble);padding:var(--s4) var(--s5);overflow-wrap:anywhere;display:flex;gap:var(--s3);align-items:flex-start}
.preview .big.wait{color:var(--muted);font-weight:500}
.preview .orig{font-size:15px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.preview .wq{display:inline-flex;color:var(--unsure-ink);margin-top:4px}
.row{display:flex;gap:var(--s3);flex-wrap:wrap}
.errline{background:var(--no-soft);color:var(--no);border-radius:16px;padding:var(--s3) var(--s4);font-weight:600}
.errline p{margin:2px 0 0;font-size:13px;font-weight:500}
.panels{display:flex;flex-direction:column;gap:var(--s3)}
.panel{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-1);overflow:hidden}
.panel>summary{list-style:none;display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2) var(--s5);cursor:pointer;font-weight:700;font-size:18px;border-radius:var(--r-card)}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .ptitle{flex:1}
.panel>summary .chev{transition:transform var(--t-fast) var(--ease);color:var(--muted)}
.panel[open]>summary .chev{transform:rotate(180deg)}
.count{min-width:28px;height:28px;padding:0 8px;border-radius:var(--r-pill);background:var(--blue);color:#fff;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pbody{padding:0 var(--s5) var(--s4)}
.pbody ul{margin:0;padding-left:20px;font-size:17px}
.pbody li{margin:var(--s2) 0;overflow-wrap:anywhere}
.none{color:var(--muted);font-size:16px;margin:0}
.task{position:relative;display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:var(--s2) 0;cursor:pointer;font-size:17px}
.task input{position:absolute;opacity:0;width:48px;height:48px;left:-8px;top:50%;transform:translateY(-50%);margin:0;padding:0;cursor:pointer}
.task .box{flex:none;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--muted);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.task .box .ic{width:18px;height:18px;stroke-width:3.5;opacity:0}
.task input:checked+.box{background:var(--ok);border-color:var(--ok)}
.task input:checked+.box .ic{opacity:1}
.task input:focus-visible+.box{outline:4px solid var(--focus);outline-offset:3px}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.rchip{flex:none;font-size:14px;font-weight:600;padding:2px 10px;border-radius:var(--r-pill);background:var(--blue-soft);color:var(--blue)}
.facts{margin:0;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:var(--s2) var(--s4);font-size:17px}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.badge.local{box-shadow:none;background:transparent;padding:6px 4px}
.foot{padding:var(--s2) var(--s5) var(--s4);font-size:14px;color:var(--muted);margin:0;text-align:center}
</style>
</head>
<body>
<header class="top">
  <span class="room" id="room"></span>
  <button type="button" class="pill" id="pair"></button>
  <span id="badge"></span>
  <span class="sp"></span>
  <span class="conn" id="conn" role="status" aria-live="polite"><i></i><span></span></span>
  <span class="clearbox"><button type="button" class="pill sm" id="clearBtn"></button>
    <span id="clearAsk" hidden class="clearbox"><span id="clearQ"></span><button type="button" class="btn danger" id="clearYes"></button><button type="button" class="btn" id="clearNo"></button></span></span>
</header>
<main class="layout">
  <div id="calls"></div>
  <section class="convcol">
    <div class="conv" id="conv" aria-live="polite" aria-label="Conversation"></div>
    <div id="errbox"></div>
    <section class="composer" id="composer">
      <div id="inputStep">
        <div class="qrow" id="qrow" aria-label="Quick phrases"></div>
        <div class="level" id="lvl" hidden aria-hidden="true"><i></i></div>
        <div class="inrow">
          <button type="button" class="btn mic" id="mic"></button>
          <textarea id="txt" rows="2"></textarea>
          <button type="button" class="btn pri" id="prevBtn"></button>
        </div>
      </div>
      <div id="previewStep" class="preview" hidden></div>
    </section>
  </section>
  <aside id="sum"></aside>
</main>
<p class="foot" id="disc"></p>
<script src="/static/audio.js"></script>
<script src="/static/ws.js"></script>
<script src="/static/worker.js"></script>
</body>
</html>
